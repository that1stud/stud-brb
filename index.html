<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stud BRB</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);color:#fff;border:0;width:100%;font-size:clamp(18px,4vw,36px);font-weight:700;cursor:pointer}
#play.hidden{display:none}
</style>
</head>
<body>
<video id="brb" autoplay loop playsinline preload="auto" src="https://github.com/that1stud/stud-brb/releases/download/v1.0/brb.mp4"></video>
<button id="play" type="button">Tap to play BRB with sound</button>
<script>
const video=document.getElementById('brb');
const button=document.getElementById('play');
video.muted=false;
async function start(){try{await video.play();button.classList.add('hidden')}catch(e){button.classList.remove('hidden')}}
button.addEventListener('click',start);
video.addEventListener('playing',()=>button.classList.add('hidden'));
video.addEventListener('pause',()=>button.classList.remove('hidden'));
video.addEventListener('error',()=>{button.textContent='Video could not load — check the video URL';button.classList.remove('hidden')});
start();
</script>
</body>
</html>
