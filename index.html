<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BRB Video</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}video{width:100%;height:100%;object-fit:contain;background:#000}button{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:700 20px system-ui;padding:16px 24px;border:0;border-radius:12px;background:#ffd000;color:#111;z-index:2}button[hidden]{display:none}</style></head>
<body><video id="video" autoplay loop playsinline preload="auto"><source src="brb.mp4" type="video/mp4"></video><button id="play" hidden>Tap to play BRB with sound</button>
<script>const v=document.getElementById('video'),b=document.getElementById('play');v.muted=false;async function start(){try{await v.play();b.hidden=true}catch(e){b.hidden=false}}b.addEventListener('click',start);start();</script></body></html>
